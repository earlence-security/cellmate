<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Edit Policy</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Page chrome */
    body {
      margin: 0;
      background: #f6f7fb;
      color: #111827;
      width: 380px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid #e5e7eb; background: #fff;
    }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #back-btn {
      background: transparent; border: none; font-size: 14px; cursor: pointer; color: #2563eb;
      padding: 6px 8px; border-radius: 6px;
    }
    main { padding: 12px; }
    #status { font-size: 14px; margin-bottom: 10px; color: #374151; line-height: 1.35; }
    #status.error { color: #b91c1c; }
    .muted { color: #6b7280; }

    /* Rule list */
    .rule-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      align-items: start;
      gap: 12px;
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .rule-row.invalid {
      border-color: #fca5a5;
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.16);
    }
    .rule-name {
      min-width: 0;
      font-size: 13px;
      line-height: 1.55;
      color: #172033;
    }

    /* iOS-style toggle */
    .toggle {
      position: relative; width: 44px; height: 24px; flex: none; margin-top: 1px;
    }
    .toggle input { display: none; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #e5e7eb; border-radius: 9999px; transition: background 0.2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 20px; width: 20px; left: 2px; top: 2px;
      background: #fff; border-radius: 9999px; transition: transform 0.2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    input:checked + .slider { background: #34c759; }
    input:checked + .slider::before { transform: translateX(20px); }

    .rule-param {
      height: 24px;
      box-sizing: border-box;
      margin: 0 3px;
      vertical-align: middle;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #111827;
      font: inherit;
      font-size: 12px;
      line-height: 22px;
    }
    .rule-param:focus,
    .multi-select.open .multi-trigger {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }
    .num-param {
      width: 58px;
      padding: 0 7px;
    }
    .num-param::placeholder { color: rgba(17, 24, 39, 0.42); }
    .single-param {
      max-width: 145px;
      padding: 0 24px 0 7px;
    }
    .multi-select {
      position: relative;
      display: inline-block;
      vertical-align: middle;
      margin: 0 3px;
    }
    .multi-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 118px;
      max-width: 180px;
      height: 24px;
      padding: 0 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #111827;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      line-height: 22px;
    }
    .multi-trigger::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #64748b;
      flex: none;
    }
    .multi-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .multi-label.empty { color: transparent; }
    .multi-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      left: 0;
      min-width: 190px;
      max-width: 280px;
      max-height: 190px;
      overflow: auto;
      display: none;
      padding: 4px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }
    .multi-select.open .multi-menu { display: block; }
    .multi-option {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #111827;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      text-align: left;
    }
    .multi-option:hover { background: #f1f5f9; }
    .multi-check {
      color: #2563eb;
      font-weight: 700;
      visibility: hidden;
    }
    .multi-option.selected .multi-check { visibility: visible; }
    .param-required {
      border-color: #ef4444;
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.16);
    }

    footer {
      padding: 12px; border-top: 1px solid #e5e7eb; background: #fff;
      display: flex; justify-content: flex-end;
    }
    #submit-btn[disabled] { opacity: .6; cursor: not-allowed; }

    .btn{
      background:#2563eb; color:#fff; border:none; border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer;
    }
    .btn:hover{ background:#1d4ed8; }
    .row-right{ display:flex; justify-content:flex-end; }

    #domain-bar {
      display: none; align-items: center; gap: 8px;
      padding: 8px 12px; background: #fff; border-bottom: 1px solid #e5e7eb;
    }
    #domain-bar label { font-size: 12px; color: #6b7280; white-space: nowrap; }
    #domain-bar select { flex: 1; }

  </style>
  <!-- Load as a module so we can import the policy engine -->
  <script type="module" src="edit.js"></script>
</head>
<body>
  <header>
    <button id="back-btn" aria-label="Close">← Back</button>
    <h1>Edit Policy</h1>
  </header>
  <div id="domain-bar">
    <label for="domain-select">Domain:</label>
    <select id="domain-select"></select>
  </div>
  <main>
    <div id="status" class="muted">Loading…</div>
    <div id="rules"></div>
  </main>
  <footer>
    <button id="submit-btn" disabled>Submit</button>
  </footer>
</body>
</html>
