<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Agent Mode</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      margin: 0;
      background: #f6f7fb;
      color: #111827;
      width: 380px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid #e5e7eb; background: #fff;
    }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #back-btn {
      background: transparent; border: none; font-size: 14px; cursor: pointer;
      color: #2563eb; padding: 6px 8px; border-radius: 6px;
    }
    #back-btn:hover { background: #eff6ff; }

    main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* Success banner */
    #banner {
      display: none; background: #ecfdf5; color: #065f46;
      border: 1px solid #a7f3d0; padding: 8px 10px; border-radius: 8px;
      font-size: 13px; position: relative;
    }
    #banner-close {
      position: absolute; right: 8px; top: 4px; background: transparent;
      border: none; font-size: 16px; cursor: pointer; color: #065f46; padding: 0;
    }

    .status-heading {
      font-size: 15px; font-weight: 600; color: #111827; line-height: 1.4;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #34c759;
      flex: none; margin-top: 3px;
    }

    /* Per-domain policy cards */
    .policy-card {
      background: #fff;
      border: 1px solid #e1e7ef;
      border-left: 5px solid #2563eb;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .policy-domain {
      font-size: 13px; font-weight: 600; color: #0369a1;
      text-decoration: none; display: block; margin-bottom: 6px;
    }
    .policy-domain:hover { text-decoration: underline; }
    .policy-preview {
      font-size: 12px; color: #374151; font-family: monospace;
      background: #f1f5f9; border-radius: 6px; padding: 6px 8px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    .no-policies {
      font-size: 14px; color: #6b7280; text-align: center; padding: 20px 0;
    }

    footer {
      padding: 12px 12px 16px; border-top: 1px solid #e5e7eb; background: #fff;
      display: flex; justify-content: center;
    }
    #stop-btn {
      background: #fca5a5; color: #7f1d1d; border: none; border-radius: 10px;
      padding: 12px 40px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    #stop-btn:hover { background: #f87171; }
  </style>
  <script src="agent.js" defer></script>
</head>
<body>
  <header>
    <button id="back-btn" aria-label="Back">← Back</button>
    <h1>Agent Mode</h1>
  </header>
  <main>
    <div id="banner">
      <span id="banner-text"></span>
      <button id="banner-close">×</button>
    </div>
    <div class="status-heading">
      <span class="status-dot"></span>
      <span>Agent Mode is ON. The following policies are enabled:</span>
    </div>
    <div id="policies"></div>
  </main>
  <footer>
    <button id="stop-btn">Exit Agent Mode</button>
  </footer>
</body>
</html>
